[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "music-steward"
version = "0.4.0"
description = "Organize a large music collection safely: scan, recognize, review, plan, apply."
readme = "README.md"
requires-python = ">=3.12"
license = "GPL-3.0-or-later"
dependencies = [
    "mutagen==1.48.1",
    "charset-normalizer==3.5.2",
    "beets==2.14.1",          # matching (in-process, behind music_steward/recognize/beets_adapter.py)
    "pyacoustid==1.3.1",
    "python3-discogs-client==2.10",
    "opencc-python-reimplemented==0.1.7",  # Simplified/Traditional search and comparison keys  # Discogs candidates (used only when DISCOGS_TOKEN is set)
]

[project.optional-dependencies]
dev = ["pytest"]
icons = ["pillow"]                # only to regenerate the app icon (tools/make_icons.py)
desktop = ["pywebview==6.2.1"]   # native window (ADR 0001); BSD-3-Clause

[project.scripts]
music-steward = "music_steward.cli:main"
steward = "music_steward.cli:main"
mp3librarytool = "music_steward.cli:main"   # old name, kept as an alias for now

[tool.setuptools.packages.find]
# discovery instead of a hand-made list: music_steward/web and web/icons hold only data, and a list that left them out
# made every `pip install` print long "Package would be ignored" warnings (seen on the owner's Mac)
include = ["music_steward*"]

[tool.setuptools.package-data]
music_steward = ["web/*", "web/icons/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
