name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install FFmpeg
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
          else
            brew install ffmpeg navidrome   # navidrome: the Subsonic compatibility test (required feature)
            navidrome --version
          fi
          ffmpeg -version | head -1
      - name: Install Music Steward
        run: pip install -e '.[dev]'
      - name: Tests
        run: python -m pytest -q
      - name: Check the web UI scripts
        run: for f in music_steward/web/*.js; do node --check "$f"; done
      - name: Version matches the changelog
        run: |
          v=$(python -c "import music_steward as m; print(m.__version__)")
          grep -q "^## \[$v\]" CHANGELOG.md || { echo "CHANGELOG.md has no entry for $v"; exit 1; }
