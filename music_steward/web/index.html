<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Music Steward</title>
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<header class="top">
  <div class="brand">Music Steward</div>
  <div class="chip" id="rootChip">…</div>
  <div class="searchwrap">
    <input type="search" id="searchBox" autocomplete="off" spellcheck="false" aria-label="Search the collection"
           placeholder="Search…  邓丽君 · denglijun · dlj   ( / )">
    <div class="searchpop" id="searchPop" hidden></div>
  </div>
  <div class="seg" role="group" aria-label="View">
    <button type="button" class="btn" data-view="folders" aria-pressed="true">Folders</button>
    <button type="button" class="btn" data-view="albums" aria-pressed="false">Albums</button>
  </div>
  <button type="button" class="btn" id="scanBtn">Scan</button>
  <button type="button" class="btn" id="recognizeBtn" title="Match the albums in the selected folder">Recognize folder</button>
  <button type="button" class="btn" id="settingsBtn" title="Naming rules, catalogues, destination">Settings</button>
  <button type="button" class="btn btn-primary" id="planBtn">Review plan →</button>
</header>

<div class="layout" id="reviewPage">
  <nav class="panel left" aria-label="Sources and filters">
    <section>
      <h2 class="ph">Sources</h2>
      <div id="tree" class="tree"></div>
    </section>
    <section>
      <div class="row-between muted small"><span>Inventory</span><span id="invCount"></span></div>
      <div class="bar"><div id="hashBar" class="bar-fill"></div></div>
      <div class="muted xsmall" id="invNote"></div>
      <div class="muted xsmall" id="scanNote"></div>
    </section>
    <section>
      <h2 class="ph">Filters</h2>
      <div id="filters" class="filters"></div>
    </section>
  </nav>

  <div class="resizer" data-side="left" role="separator" aria-orientation="vertical"
       title="Drag to resize · double-click to auto-size"></div>
  <main class="panel center">
    <div class="center-head">
      <div style="min-width:0">
        <h1 id="tableTitle">…</h1>
        <div class="muted small" id="tableNote"></div>
      </div>
      <div class="actions">
        <input type="search" id="listFilter" class="listfilter" placeholder="Filter this list…" aria-label="Filter this list"
               autocomplete="off" spellcheck="false">
        <span class="muted small" id="folderStats"></span>
        <details class="colmenu" id="colMenu"><summary class="btn">Columns</summary><div class="colmenu-pop" id="colMenuPop"></div></details>
        <button type="button" class="btn" id="rescanFolderBtn" title="Re-read only this folder (fast)">Re-scan folder</button>
        <button type="button" class="btn" id="hashFolderBtn" title="Hash this folder's audio for duplicate detection">Hash folder</button>
      </div>
    </div>
    <div class="table-wrap"><table id="table"></table></div>
  </main>

  <div class="resizer" data-side="right" role="separator" aria-orientation="vertical"
       title="Drag to resize · double-click to auto-size"></div>
  <aside class="panel right" aria-label="Details" id="details">
    <p class="muted">Select a file or album to see its details.</p>
  </aside>
</div>
<div id="planPage" class="plan-page" hidden></div>
<script src="/static/i18n.js"></script>
<script src="/static/dialog.js"></script>
<script src="/static/app.js"></script>
<script src="/static/plan.js"></script>
</body>
</html>
